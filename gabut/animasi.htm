<!DOCTYPE html>
<html>
<head>
    <title>Game Animasi</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #060404;
            font-family: Arial, sans-serif;
        }

        .game-container {
            position: relative;
            width: 800px;
            height: 600px;
        }

        canvas {
            background-color: #ecf0f1;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        }

        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom right, #667eea 0%, #764ba2 10%, #e24f8d 50%, #8b9d3d 100%);
            pointer-events: none;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .stars::after {
            content: '';
            position: absolute;
            width: 5px;
            height: 5px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.3s ease-in-out;
        }

        .target {
            position: fixed;
            bottom: 20px;
            left: 50%;
            width: 40px;
            height: 40px;
            background-color: #ff6b6b;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.3);
        }

        .robot {
            position: absolute;
            width: 80px;
            height: 40px;
            background-color: #764ba2;
            border-radius: 10px;
            left: 50px;
            top: 150px;

            animation: bounce 2s infinite, expression 0.8s infinite alternate;
        }

            @keyframes bounce {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-30px); }
            }

            @keyframes expression {
                from { transform: translateY(0); }
                to { transform: translateY(-10px); }
        }

        .ball {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #f3f3f3;
            border-radius: 10px;
            left: 780px;
            top: 150px;
            pointer-events: none;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="controls" id="controls"></div>
        <div class="background"></div>
        <div class="target"></div>
        <div class="robot"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const controlsDiv = document.getElementById('controls');
        
        // Pastikan canvas diisi dengan bintang
        createStars();

        function createStars() {
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.style.position = 'absolute';
                star.style.width = '2px';
                star.style.height = '2px';
                star.style.backgroundColor = 'white';
                star.style.borderRadius = '50%';
                
                // Acak posisi dan warna
                const top = Math.random() * canvas.width;
                const left = Math.random() * canvas.height;
                const opacity = Math.random();
                
                star.style.opacity = opacity;
                star.style.left = left + 'px';
                star.style.top = top + 'px';
                star.style.animationDelay = Math.random() * 10 + 's';
                
                canvas.appendChild(star);
            }
        }

        function updateStars() {
            requestAnimationFrame(updateStars);
            createStars();
        }
        
        // Mencegah pergerakan robot
        let isDragging = false;
        let lastX = 0;
        let lastY = 0;

        robot = document.querySelector('.robot');

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX + 'px';
            lastY = e.clientY + 'px';
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const x = e.clientX + 'px';
                const y = e.clientY + 'px';
                robot.style.left = x - 50 + 'px';
                robot.style.top = y - 130 + 'px';
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Handle click
        canvas.addEventListener('click', (e) => {
            e.preventDefault();
            
            const rect = robot.getBoundingClientRect();
            let targetX = ((e.clientX - rect.left) / (rect.width)) * 20 + 780;
            let targetY = ((e.clientY - rect.top) / (rect.height)) * 20 + 150;
            
            ball.style.left = targetX + 'px';
            ball.style.top = targetY + 'px';
        });

        // Update posisi bola
        function updateBall() {
            requestAnimationFrame(updateBall);
            
            const rectRobot = robot.getBoundingClientRect();
            const centerX = (rectRobot.left + rectRobot.right) / 2;
            const centerY = (rectRobot.top + rectRobot.bottom) / 2;
            
            ball.style.left = (robot.clientX - ((centerX - lastX) * 10)) + 'px';
            ball.style.top = (robot.clientY - ((centerY - lastY) * 10)) + 'px';
        }

        // Mencegah pergerakan yang terlalu cepat
        function limitSpeed(currentX, currentY) {
            return Math.max(0, Math.min(canvas.width - 20, currentX)) / 5,
                   Math.max(0, Math.min(canvas.height - 20, currentY));
        }

        // Handle mouseover dan mouseout
        const ball = document.querySelector('.ball');
        ball.style.left = '780px';
        ball.style.top = '150px';

        canvas.addEventListener('mousemove', (e) => {
            if (e.target == ball) {
                ball.style.left = ((e.clientX - 780) * 2) + 'px';
                ball.style.top = ((e.clientY - 150) * 2) + 'px';
            }
        });

        canvas.addEventListener('mousemove', function(e) {
            // Handle mouseover
            if (ball.style.left.includes('fixed')) {
                const x = e.clientX;
                const y = e.clientY;

                let targetX = ((x - ball.offsetLeft) / 80) * 5 + 780;
                let targetY = ((y - ball.offsetTop) / 40) * 3 + 150;

                if (Math.abs(targetX - 780) < 20 && Math.abs(targetY - 150) < 20) {
                    ball.style.left = 'fixed';
                } else {
                    ball.style.left = targetX + 'px';
                    ball.style.top = targetY + 'px';
                }
            }
        });

        // Handling bulls-eye
        const bullseye = document.querySelector('.target');
        bullseye.style.backgroundColor = '#ffffff';

        function updateBullseye() {
            requestAnimationFrame(updateBullseye);
            
            let angle = robot.style.angle;
            if (Math.sin(angle * 0.5) > 0.3) {
                bullseye.style.backgroundColor = 'rgba(255, 255, 255, 0.7)';
            } else {
                bullseye.style.backgroundColor = '#ffffff';
            }
        }

        updateBullseye();
    </script>
</body>
</html>
